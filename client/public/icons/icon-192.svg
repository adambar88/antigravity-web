<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="glow-192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Chevron & Delta Gradient -->
    <linearGradient id="delta-grad-192" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0e9df"/>
    </linearGradient>

    <!-- Floating Orb Gradient -->
    <linearGradient id="orb-grad-192" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0e9df"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ring-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e9df" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Levitating Core -->
    <filter id="shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Maskable Safe Area Aware) -->
  <rect width="192" height="192" rx="42" fill="url(#bg-grad-192)"/>

  <!-- Subtle Rim Border -->
  <rect width="190" height="190" x="1" y="1" rx="41" stroke="#30363d" stroke-width="1.5" fill="none"/>

  <!-- Quantum Energy Halo -->
  <circle cx="96" cy="96" r="68" fill="url(#glow-192)"/>

  <!-- Antigravity Tilted Orbital Ring -->
  <ellipse cx="96" cy="108" rx="58" ry="20"
           stroke="url(#ring-grad-192)" stroke-width="2.5"
           transform="rotate(-18 96 108)" stroke-dasharray="8 3 45 4"/>

  <!-- Orbital Field Satellite Particle -->
  <circle cx="146" cy="92" r="3" fill="#f0e9df" filter="url(#shadow-192)"/>

  <!-- Kinetic Levitation Chevrons (Overcoming Gravity) -->
  <g filter="url(#shadow-192)">
    <!-- Lower Propulsion Bracket -->
    <path d="M60 128 L96 106 L132 128 L126 135 L96 117 L66 135 Z"
          fill="#38bdf8" fill-opacity="0.5"/>

    <!-- Main Upward Antigravity Prism Delta -->
    <path d="M96 46 L134 112 L96 98 L58 112 Z"
          fill="url(#delta-grad-192)"/>

    <!-- Inner Core Cutout Facet -->
    <path d="M96 55 L124 105 L96 93 L68 105 Z"
          fill="#0d1117" fill-opacity="0.65"/>
  </g>

  <!-- Central Levitating Singularity Orb -->
  <circle cx="96" cy="80" r="11" fill="url(#orb-grad-192)" filter="url(#shadow-192)"/>
  <circle cx="93" cy="77" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
</svg>
