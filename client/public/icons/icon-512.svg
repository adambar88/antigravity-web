<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="glow-512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Chevron & Delta Gradient -->
    <linearGradient id="delta-grad-512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0e9df"/>
    </linearGradient>

    <!-- Secondary Accents Gradient -->
    <linearGradient id="accent-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e9df"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Floating Orb Gradient -->
    <linearGradient id="orb-grad-512" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0e9df"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ring-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e9df" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Outer Orbital Ring Gradient -->
    <linearGradient id="outer-ring-512" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Levitating Core -->
    <filter id="shadow-512" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Ambient Glow -->
    <filter id="ambient-glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Standard Maskable Safe Area Aware) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-512)"/>

  <!-- Subtle Precision Rim Border -->
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="#30363d" stroke-width="3" fill="none"/>

  <!-- Quantum Energy Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-512)"/>

  <!-- Outer Faint Coordinate Grid Rings -->
  <circle cx="256" cy="256" r="160" stroke="url(#outer-ring-512)" stroke-width="2" stroke-dasharray="6 8" fill="none"/>

  <!-- Antigravity Tilted Primary Orbital Ring -->
  <ellipse cx="256" cy="288" rx="155" ry="54"
           stroke="url(#ring-grad-512)" stroke-width="6"
           transform="rotate(-18 256 288)" stroke-dasharray="24 10 120 12"/>

  <!-- Secondary Counter-Orbital Trajectory -->
  <ellipse cx="256" cy="288" rx="130" ry="38"
           stroke="url(#ring-grad-512)" stroke-width="2"
           transform="rotate(22 256 288)" stroke-dasharray="8 16" stroke-opacity="0.4"/>

  <!-- Orbital Field Particles -->
  <circle cx="390" cy="245" r="8" fill="#f0e9df" filter="url(#shadow-512)"/>
  <circle cx="125" cy="318" r="5" fill="#38bdf8" filter="url(#shadow-512)"/>

  <!-- Kinetic Levitation Assembly -->
  <g filter="url(#shadow-512)">
    <!-- Lower Propulsion Energy Cradle -->
    <path d="M160 340 L256 282 L352 340 L336 358 L256 312 L176 358 Z"
          fill="#38bdf8" fill-opacity="0.4"/>

    <!-- Kinetic Upward Antigravity Prism Delta -->
    <path d="M256 122 L358 298 L256 261 L154 298 Z"
          fill="url(#delta-grad-512)"/>

    <!-- Inner Core Cutout Facet (Creating depth & levitation illusion) -->
    <path d="M256 148 L330 280 L256 248 L182 280 Z"
          fill="#0d1117" fill-opacity="0.75"/>

    <!-- Subtle Apex Beam Line -->
    <line x1="256" y1="122" x2="256" y2="248" stroke="url(#accent-grad-512)" stroke-width="2.5" stroke-opacity="0.6"/>
  </g>

  <!-- Central Levitating Singularity Orb -->
  <circle cx="256" cy="214" r="29" fill="url(#orb-grad-512)" filter="url(#shadow-512)"/>
  <!-- Specular Reflection Highlight -->
  <circle cx="248" cy="205" r="9" fill="#ffffff" fill-opacity="0.9"/>
</svg>
