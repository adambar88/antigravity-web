<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Mobile Ergonomics Viewport: Prevents auto-zoom, handles virtual keyboard resizing -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Title & SEO Metadata -->
    <title>Antigravity Web Studio</title>
    <meta
      name="description"
      content="Autonomous development studio and reactive AI interface for high-velocity software engineering"
    />

    <!-- Theme Color Metas (Responsive to Color Scheme & Dark/Light Defaults) -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0e9df" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Mobile Touch Callouts & Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Antigravity" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicons & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Typography: Inter for UI, JetBrains Mono for Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile Safe Areas and Viewport CSS Resets -->
    <style>
      :root {
        --keyboard-offset: 0px;
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }

      html,
      body {
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior-y: none;
        touch-action: manipulation;
      }

      #root {
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-app text-main antialiased selection:bg-purple-200 selection:text-purple-900">
    <div id="root"></div>

    <!-- Early bootstrap error catcher: Prevents blank black screen on script/module failures -->
    <script>
      window.addEventListener('error', function (event) {
        // Only show if the React app hasn't mounted anything into #root
        var root = document.getElementById('root');
        if (!root || root.childNodes.length === 0) {
          console.error('[Bootstrap Error]', event.error || event.message);
          var errBox = document.getElementById('agy-bootstrap-error');
          if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'agy-bootstrap-error';
            errBox.style.cssText = 'position:fixed;inset:0;background:#0d1117;color:#f0f6fc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99999;font-family:system-ui,-apple-system,sans-serif;text-align:center;';
            errBox.innerHTML = '<div style="max-width:520px;background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,0.5);"><div style="font-size:32px;margin-bottom:12px;">⚠️</div><h2 style="font-size:18px;font-weight:700;margin:0 0 8px;color:#f85149;">Wystąpił problem z uruchomieniem aplikacji</h2><p style="font-size:13px;color:#8b949e;line-height:1.5;margin:0 0 16px;">Wystąpił błąd ładowania skryptów lub pamięć podręczna przeglądarki jest nieaktualna. Kliknij poniższy przycisk, aby wyczyścić pamięć podręczną i zaktualizować aplikację.</p><div id="agy-err-detail" style="font-family:monospace;font-size:11px;background:#0d1117;color:#f85149;padding:10px 14px;border-radius:8px;border:1px solid #21262d;text-align:left;margin-bottom:16px;overflow:auto;max-height:120px;"></div><button onclick="if(window.navigator&&navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(regs){for(var i=0;i<regs.length;i++){regs[i].unregister();}});};try{localStorage.clear();sessionStorage.clear();}catch(e){};window.location.reload(true);" style="background:#7c3aed;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s;">Wyczyść pamięć podręczną i odśwież</button></div>';
            document.body ? document.body.appendChild(errBox) : document.documentElement.appendChild(errBox);
          }
          var detailEl = document.getElementById('agy-err-detail');
          if (detailEl) {
            detailEl.textContent = (event.error && (event.error.stack || event.error.message)) || event.message || 'Nieznany błąd skryptu';
          }
        }
      });
    </script>

    <!-- Application Script Entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Progressive PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          const isAgy = window.location.pathname.startsWith('/agy');
          const swPath = isAgy ? '/agy/sw.js' : '/sw.js';
          const swScope = isAgy ? '/agy/' : '/';
          navigator.serviceWorker
            .register(swPath, { scope: swScope })
            .then((registration) => {
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[SW] New version available of Antigravity Web Studio.');
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.debug('[SW] Registration deferred or unavailable:', err);
            });
        });
      }
    </script>
  </body>
</html>
